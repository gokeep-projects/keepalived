name: Build Kylin V11 loongarch64

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: 'loongarch64 base image (empty = auto)'
        required: false
        default: ''
  push:
    branches:
      - build/kylin-v11-loongarch64
    paths:
      - '.github/workflows/build-kylin-v11-loongarch64.yml'
      - '.github/scripts/build-kylin-v11-loongarch64.sh'
      - '.github/scripts/prepare-loong64-image.sh'

permissions:
  contents: write

jobs:
  build:
    name: keepalived 2.3.2 / loongarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify version
        run: |
          version=$(sed -n 's/^AC_INIT(\[Keepalived\], \[\([^]]*\)\].*/\1/p' configure.ac)
          echo "keepalived version: $version"
          [ "$version" = "2.3.2" ] \
            || { echo "ERROR: expected keepalived 2.3.2"; exit 1; }

      - name: Enable loongarch64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: loong64

      - name: Prepare loongarch64 image
        id: img
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          mkdir -p out
          if [ -n "$BASE_IMAGE" ]; then
            docker pull --platform linux/loong64 "$BASE_IMAGE"
            echo "$BASE_IMAGE" > /tmp/loong64-image.txt
          else
            bash .github/scripts/prepare-loong64-image.sh 2>&1 | tee out/prepare.log
          fi
          echo "image=$(cat /tmp/loong64-image.txt)" >> "$GITHUB_OUTPUT"

      - name: Build in loongarch64 container
        env:
          BASE_IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -o pipefail
          docker run --rm --platform linux/loong64 \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/src -w /src \
            "$BASE_IMAGE" \
            bash /src/.github/scripts/build-kylin-v11-loongarch64.sh \
            2>&1 | tee out/build.log

      - name: Show build info
        if: always()
        run: |
          cat out/BUILD-INFO.txt 2>/dev/null || true
          ls -l out 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepalived-2.3.2-kylin-v11-loongarch64
          path: out/
          if-no-files-found: warn

      - name: Publish results to artifacts branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -rf .git
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "keepalived 2.3.2 loongarch64 build $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            || git commit -q --allow-empty -m "empty"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:artifacts
